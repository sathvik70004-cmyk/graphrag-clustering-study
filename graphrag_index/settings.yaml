### GraphRAG 3.3.0 — used for KNOWLEDGE-GRAPH EXTRACTION ONLY.
### Clustering, community reports, retrieval and evaluation are done in src/graphrag_study.
### Extraction LLM: free-tier online API (keeps the local GPU idle). Embeddings: local Ollama.

completion_models:
  default_completion_model:
    # Online, free-tier, OpenAI-compatible provider. Set these in graphrag_index/.env
    # (see .env.example). Local fallback: api_base http://localhost:11434/v1, model qwen3-8b-gr.
    model_provider: openai
    model: ${GRAPHRAG_LLM_MODEL}
    api_base: ${GRAPHRAG_API_BASE}
    api_key: ${GRAPHRAG_API_KEY}
    auth_method: api_key
    call_args:
      temperature: 0
    retry:
      type: exponential_backoff
    rate_limit:
      type: sliding_window
      requests_per_period: ${GRAPHRAG_RPM}   # stay under the free tier's requests/minute
      tokens_per_period: ${GRAPHRAG_TPM}     # and under its tokens/minute
      period_in_seconds: 60

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: embeddinggemma
    api_base: http://localhost:11434/v1
    api_key: ollama
    auth_method: api_key
    retry:
      type: exponential_backoff

concurrent_requests: 1             # single 8 GB GPU: parallel requests were ~3x slower in testing

input:
  type: text

# Each HotpotQA paragraph (~120 tokens) is its own document, so 1 chunk = 1 paragraph
# (keeps sentence provenance). Chunks never span documents.
chunking:
  type: tokens
  size: 1200
  overlap: 0
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "input"
output_storage:
  type: file
  base_dir: "output"
reporting:
  type: file
  base_dir: "logs"
cache:
  type: json                        # finished LLM calls are cached -> runs are resumable
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: output\lancedb

# Extraction-only pipeline: no GraphRAG clustering / community reports / embeddings.
workflows:
  - load_input_documents
  - create_base_text_units
  - create_final_documents
  - extract_graph
  - finalize_graph
  - create_final_text_units

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  # Wikipedia domain: creative works (films, albums, books, songs, shows) are frequent HotpotQA
  # bridge entities and are missing from GraphRAG's default types. Fixed a priori; not tuned on QA.
  entity_types: [person, organization, geo, event, creative_work, product]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: true
  embeddings: false

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"
global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"
drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_search_reduce_prompt.txt"
basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
