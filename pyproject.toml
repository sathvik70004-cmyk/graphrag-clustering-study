[project]
name = "graphrag-study"
version = "0.1.0"
description = "Does more stable clustering improve GraphRAG answers? A HotpotQA robustness study."
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphrag==3.3.0",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "networkit>=11.0",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "rank-bm25>=0.2.2",
    "ollama>=0.4",
    "pyyaml>=6",
    "tqdm>=4.66",
    "typer>=0.12",
    "ujson>=5.10",  # required by official hotpot_evaluate_v1.py
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jupyterlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_study"]

[tool.ruff]
line-length = 100
