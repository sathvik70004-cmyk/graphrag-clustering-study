# Frozen experiment settings. Do NOT tune these on final question results.
seed: 42

data:
  hotpot_file: data/raw/hotpot_dev_distractor_v1.json
  n_questions: 500          # pilot run uses n_pilot first
  n_pilot: 100
  stratify_by: type         # bridge / comparison

models:
  ollama_host: http://localhost:11434
  llm: qwen3-8b-gr            # qwen3:8b, num_ctx 8192, thinking off via reasoning_effort=none
  embedding: embeddinggemma  # already installed
  temperature: 0.0

clustering:
  methods: [leiden, louvain, kcore]
  seeds: [0, 1, 2]          # leiden/louvain are stochastic; kcore is deterministic

perturbation:
  fraction: 0.05
  random_repeats: 5
  critical: edge_betweenness

retrieval:
  methods: [local, routed, global]
  context_token_budget: 4000
  top_k_sentences: 10
  global_subset: 100        # global search only on a subset (local-LLM cost)
